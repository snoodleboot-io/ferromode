[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ferromode-training"
version = "1.0.0"
description = "LSTM boundary prediction model training for Ferromode EMD"
authors = [{name = "Ferromode Contributors"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
keywords = ["emd", "lstm", "boundary-prediction", "signal-processing"]

dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.13",
    "mypy>=1.8.0",
]

viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

gpu = [
    "torch[cuda]>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/yourname/ferromode"
Documentation = "https://ferromode.readthedocs.io"
Repository = "https://github.com/yourname/ferromode"
Issues = "https://github.com/yourname/ferromode/issues"

[tool.setuptools]
packages = ["training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=training --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py312', 'py313', 'py314']

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
