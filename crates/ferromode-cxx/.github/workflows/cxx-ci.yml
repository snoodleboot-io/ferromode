name: C++ CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/ferromode-cxx/**'
      - 'crates/ferromode/**'
  pull_request:
    branches: [main]
    paths:
      - 'crates/ferromode-cxx/**'
      - 'crates/ferromode/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: windows-2022
            compiler: msvc-2022
            cc: cl
            cxx: cl
          - os: macos-14
            compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install GCC 12 (Ubuntu)
        if: matrix.compiler == 'gcc-12'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12

      - name: Install Clang 15 (Ubuntu)
        if: matrix.compiler == 'clang-15'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/ferromode
            crates/ferromode-cxx

      - name: Build Rust crate
        run: cargo build -p ferromode-cxx --release
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Run Rust tests
        run: cargo test -p ferromode-cxx --release
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build C++ tests
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DFERROMODE_CXX_BUILD_TESTS=ON
          cmake --build build --config Release
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure -C Release

  sanitize:
    name: Sanitizers (GCC 12)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install GCC 12
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build with ASan/UBSan
        run: cargo build -p ferromode-cxx
        env:
          RUSTFLAGS: "-Z sanitizer=address"
          CC: gcc-12
          CXX: g++-12
          CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Run tests with ASan/UBSan
        run: cargo test -p ferromode-cxx
        env:
          RUSTFLAGS: "-Z sanitizer=address"
          CC: gcc-12
          CXX: g++-12
          CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:abort_on_error=1"
