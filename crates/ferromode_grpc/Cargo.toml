[package]
name = "ferromode_grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "gRPC microservice for distributed EMD decomposition"

[dependencies]
ferromode = { path = "../ferromode" }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
tonic = "0.11"
prost = "0.14"
ndarray = { workspace = true }

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "grpc_load_test"
harness = false
path = "benches/grpc_load_test.rs"
