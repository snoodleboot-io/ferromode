[package]
name = "ferromode-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bindings for Ferromode via wasm-bindgen"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ferromode = { path = "../ferromode" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }

# `ferromode` pulls in rand 0.8 -> getrandom 0.2, which refuses to build for
# wasm32-unknown-unknown unless its "js" backend is enabled. Features are
# additive, so enabling it here turns on the JS RNG for the whole wasm build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
