[package]
name = "ferromode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core signal processing and mode analysis library"

[features]
default = []
python = ["dep:pyo3"]
r = ["dep:extendr-api"]
gpu = ["cuda", "rocm"]
cuda = []
rocm = []
webgpu = []
boundary-prediction = ["ort"]
parallel = []

[dependencies]
ndarray = { workspace = true }
rayon = { workspace = true }
rustfft = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
num-complex = { workspace = true }
# Drop-in Instant that re-exports std on native and uses performance.now() on
# wasm, where std::time::Instant::now() panics ("time not implemented").
web-time = "1.1"
ort = { workspace = true, optional = true }
pyo3 = { version = "^0.29", optional = true }
extendr-api = { version = "0.9", optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "benchmarks"
harness = false
path = "benches/benchmarks.rs"

[[bench]]
name = "gpu_ensemble"
harness = false
path = "benches/gpu_ensemble.rs"

[[bench]]
name = "streaming"
harness = false
path = "benches/streaming.rs"

[[bench]]
name = "multidim_2d_decomposition"
harness = false
path = "benches/multidim_2d_decomposition.rs"

[[bench]]
name = "multidim_3d_decomposition"
harness = false
path = "benches/multidim_3d_decomposition.rs"

[[bench]]
name = "entropy_benchmarks"
harness = false
path = "benches/entropy_benchmarks.rs"
