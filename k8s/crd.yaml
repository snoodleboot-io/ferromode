---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: emdjobs.ferromode.io
spec:
  group: ferromode.io
  names:
    kind: EMDJob
    plural: emdjobs
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            metadata:
              type: object
            spec:
              type: object
              required:
                - signal
              properties:
                signal:
                  type: object
                  required:
                    - source
                    - url
                  properties:
                    source:
                      type: string
                      enum: ["parquet", "csv", "http"]
                      description: Data source type
                    url:
                      type: string
                      description: URL or path to signal data
                config:
                  type: object
                  properties:
                    maxImfs:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                      description: Maximum number of IMFs to extract
                    boundary:
                      type: string
                      enum: ["symmetric", "periodic", "extension"]
                      default: "symmetric"
                      description: Boundary condition method
                    stoppingCriterion:
                      type: string
                      enum: ["sd_threshold", "energy_ratio", "max_iterations"]
                      default: "sd_threshold"
                      description: Stopping criterion for sifting
                parallelism:
                  type: integer
                  minimum: 1
                  maximum: 256
                  default: 4
                  description: Number of parallel trial replicas
                timeout:
                  type: string
                  pattern: '^\d+[smh]$'
                  default: "1h"
                  description: Job timeout (e.g., 30m, 1h, 2h)
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                  description: Node selector for pod scheduling
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Running", "Complete", "Failed"]
                imfCount:
                  type: integer
                  description: Number of IMFs successfully extracted
                resultUrl:
                  type: string
                  description: URL where results are stored
                createdAt:
                  type: string
                  format: date-time
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                message:
                  type: string
                  description: Status message or error description
