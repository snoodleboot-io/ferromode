[workspace]
members = [
    "crates/ferromode",
    "crates/ferromode-py",
    "crates/ferromode-r",
    "crates/ferromode-wasm",
    "crates/ferromode-mex",
    "crates/ferromode-julia",
    "crates/ferromode-cxx",
    "crates/ferromode_grpc",
    "crates/ferromode_datasets",
    "crates/ferromode_validator",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferromode/ferromode"

[workspace.dependencies]
ndarray = "0.15"
rayon = "1.8"
rustfft = "6"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
num-complex = "0.4"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }

criterion = "0.8"
proptest = "1.4"
serde_json = "1"
cxx = "1.0"
cxx-build = "1.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# --- New-in-beta lints that are too noisy for this codebase ---
# Retrofitting #[must_use] to every public method is out of scope.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Numeric casts in DSP/signal-processing code are intentional.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_slice_from_raw_parts = "allow"
# Mathematical routines legitimately use single-character variable names.
many_single_char_names = "allow"
# Subjective line-count limit; complex algorithms span many lines by nature.
too_many_lines = "allow"
# Existing type signatures are stable public API.
type_complexity = "allow"
needless_pass_by_value = "allow"
# Style preferences that don't affect correctness.
items_after_statements = "allow"
if_not_else = "allow"
single_match_else = "allow"
match_same_arms = "allow"
bool_to_int_with_if = "allow"
# Float comparisons against exact constants are intentional in tests.
float_cmp = "allow"
# Style/simplification suggestions deferred to a separate cleanup pass.
manual_abs_diff = "allow"
manual_clamp = "allow"
manual_div_ceil = "allow"
manual_map = "allow"
manual_memcpy = "allow"
manual_range_contains = "allow"
needless_range_loop = "allow"
vec_init_then_push = "allow"
map_clone = "allow"
format_push_string = "allow"
stable_sort_primitive = "allow"
unnecessary_literal_bound = "allow"
ptr_cast_constness = "allow"
unused_self = "allow"
unused_enumerate_index = "allow"
no_effect_underscore_binding = "allow"
unnecessary_wraps = "allow"
doc_overindented_list_items = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
excessive_precision = "allow"
derivable_impls = "allow"
erasing_op = "allow"
identity_op = "allow"
assign_op_pattern = "allow"
len_zero = "allow"
range_plus_one = "allow"
redundant_closure_for_method_calls = "allow"
