[workspace]
members = [
    "crates/ferromode",
    "crates/ferromode-py",
    "crates/ferromode-r",
    "crates/ferromode-wasm",
    "crates/ferromode-mex",
    "crates/ferromode-julia",
    "crates/ferromode-go",
    "crates/ferromode-cxx",
    "crates/ferromode_grpc",
    "crates/ferromode_datasets",
    "crates/ferromode_validator",
    "tools/ferromode_run",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferromode/ferromode"

[workspace.dependencies]
ndarray = "0.15"
rayon = "1.8"
rustfft = "6"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
num-complex = "0.4"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }

criterion = "0.5"
proptest = "1.4"
serde_json = "1"
cxx = "1.0"
cxx-build = "1.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
