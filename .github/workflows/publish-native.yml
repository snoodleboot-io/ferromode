name: Publish native artifacts (C++ / MEX)

# Builds the C++ (ferromode-cxx) and MEX (ferromode-mex) libraries on each OS and
# attaches packaged archives to the GitHub Release for the tag. Triggered by
# release.yml after the release is created, or manually.
#
# C++ and MEX have no central package registry, so GitHub Releases are the
# distribution channel:
#   - C++:  header + per-platform shared library + integration README
#   - MEX:  per-platform MATLAB MEX binary (+ a Linux Octave build) + .m wrappers
#           For MATLAB users this can also be linked from MATLAB File Exchange;
#           Octave users run `pkg install <release-url>`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being published (e.g. 1.2.3)"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x86_64
            target_id: linux-x86_64
            cxx_lib: libferromode_cxx.so
            mex_lib: libferromode_mex.so
            mex_ext: mexa64
          - os: macos-14
            label: macOS arm64
            target_id: macos-arm64
            cxx_lib: libferromode_cxx.dylib
            mex_lib: libferromode_mex.dylib
            mex_ext: mexmaca64
          - os: windows-latest
            label: Windows x86_64
            target_id: windows-x86_64
            cxx_lib: ferromode_cxx.dll
            mex_lib: ferromode_mex.dll
            mex_ext: mexw64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set release version
        uses: ./.github/actions/set-version
        with:
          version: ${{ inputs.version || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: v
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version || github.ref_name }}

      - name: Build C++ and MEX libraries
        run: cargo build --release -p ferromode-cxx -p ferromode-mex

      # ── C++ package: header + shared lib + integration README ───────────────
      - name: Package C++
        run: |
          V="${{ steps.v.outputs.version }}"
          pkg="ferromode-cxx-${V}-${{ matrix.target_id }}"
          mkdir -p "$pkg/include" "$pkg/lib"
          cp crates/ferromode-cxx/include/ferromode.hpp "$pkg/include/"
          cp "target/release/${{ matrix.cxx_lib }}" "$pkg/lib/"
          cat > "$pkg/README.md" <<EOF
          # ferromode-cxx $V (${{ matrix.target_id }})

          C++ bindings for Ferromode (wraps the C ABI).

          - \`include/ferromode.hpp\` — the header (C++20, uses std::span)
          - \`lib/${{ matrix.cxx_lib }}\` — the shared library to link against

          Compile: \`-Iinclude\`, link \`lib/${{ matrix.cxx_lib }}\`, and ensure the
          library is on the runtime search path. See the repository README and
          crates/ferromode-cxx/CMakeLists.txt for a CMake integration example.
          EOF
          tar -czf "${pkg}.tar.gz" "$pkg"

      # ── MEX package: renamed MATLAB binary + .m wrappers ────────────────────
      - name: Package MEX
        run: |
          V="${{ steps.v.outputs.version }}"
          pkg="ferromode-mex-${V}-${{ matrix.target_id }}"
          mkdir -p "$pkg"
          cp crates/ferromode-mex/m/*.m "$pkg/"
          cp "target/release/${{ matrix.mex_lib }}" "$pkg/ferromode_mex.${{ matrix.mex_ext }}"
          cat > "$pkg/README.md" <<EOF
          # ferromode-mex $V (${{ matrix.target_id }})

          MEX bindings for Ferromode (MATLAB). Add this folder to your MATLAB path.
          \`ferromode_mex.${{ matrix.mex_ext }}\` is the compiled MEX file; the
          \`*.m\` files are the user-facing wrappers.
          EOF
          tar -czf "${pkg}.tar.gz" "$pkg"

      # ── Octave build (Linux only): classic mx* symbols, loadable in Octave ──
      - name: Package MEX for Octave (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          V="${{ steps.v.outputs.version }}"
          FERROMODE_OCTAVE=1 cargo build --release -p ferromode-mex
          pkg="ferromode-mex-octave-${V}-linux-x86_64"
          mkdir -p "$pkg"
          cp crates/ferromode-mex/m/*.m "$pkg/"
          cp target/release/libferromode_mex.so "$pkg/ferromode_mex.mex"
          cat > "$pkg/README.md" <<EOF
          # ferromode-mex (Octave) $V

          Octave build of the Ferromode MEX bindings. Install with:
          \`pkg install <this-archive-url>\` or add the folder to your Octave path.
          EOF
          tar -czf "${pkg}.tar.gz" "$pkg"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          files: |
            ferromode-cxx-*.tar.gz
            ferromode-mex-*.tar.gz
