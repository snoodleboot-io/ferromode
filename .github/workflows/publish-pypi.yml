name: Publish to PyPI

# Triggered by release.yml after the GitHub release is created and the
# publish-pypi environment gate is approved by a reviewer.
#
# Mirrors the wheel build structure from ci.yml: one explicit job per
# platform, each builds + tests its wheel, then the publish job downloads
# every tested artifact and uploads to PyPI. Nothing is rebuilt at publish
# time — what was tested is exactly what ships.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being published (e.g. 1.2.3)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Per-platform wheel builds (parallel) ────────────────────────────────────
  # Each job matches its counterpart in ci.yml: same runner, same maturin-action
  # args, same test command. The only addition is upload-artifact at the end.

  wheel-linux-x86:
    name: Wheel · Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: --release --out dist --manifest-path crates/ferromode-py/Cargo.toml
      - name: Test wheel
        run: |
          pip install --find-links dist --no-index ferromode
          pip install pytest numpy
          pytest crates/ferromode-py/tests/ -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86
          path: dist/

  wheel-linux-arm64:
    name: Wheel · Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel (QEMU cross-compile)
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          manylinux: auto
          args: --release --out dist --manifest-path crates/ferromode-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-arm64
          path: dist/

  wheel-macos-intel:
    name: Wheel · macOS Intel
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --manifest-path crates/ferromode-py/Cargo.toml
      - name: Test wheel
        run: |
          pip install --find-links dist --no-index ferromode
          pip install pytest numpy
          pytest crates/ferromode-py/tests/ -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-intel
          path: dist/

  wheel-macos-arm:
    name: Wheel · macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist --manifest-path crates/ferromode-py/Cargo.toml
      - name: Test wheel
        run: |
          pip install --find-links dist --no-index ferromode
          pip install pytest numpy
          pytest crates/ferromode-py/tests/ -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm
          path: dist/

  wheel-windows:
    name: Wheel · Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --manifest-path crates/ferromode-py/Cargo.toml
      - name: Test wheel
        run: |
          pip install --find-links dist --no-index ferromode
          pip install pytest numpy
          pytest crates/ferromode-py/tests/ -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/

  # ── Publish (reviewer must approve via publish-pypi environment) ─────────────
  # Downloads the exact wheel artifacts tested above — no rebuild.
  publish:
    name: Publish to PyPI
    needs: [wheel-linux-x86, wheel-linux-arm64, wheel-macos-intel, wheel-macos-arm, wheel-windows]
    runs-on: ubuntu-latest
    environment: publish-pypi

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: Install twine
        run: pip install twine

      - name: Check wheel metadata
        run: twine check dist/*.whl

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*.whl --skip-existing

      - name: Write job summary
        run: |
          {
            echo "## PyPI · ferromode v${{ inputs.version }}"
            echo ""
            echo "| Wheel | Status |"
            echo "|---|---|"
            for w in dist/*.whl; do echo "| $(basename $w) | published |"; done
          } >> $GITHUB_STEP_SUMMARY
