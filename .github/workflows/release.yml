name: Release (trunk-based)

# Trunk-based, registry-derived releases (mirrors snoodleboot-io/pirn).
#   PR → main  : derive MAJOR.MINOR.<PR>.devN → TestPyPI + dry-run npm/crates
#   push → main: derive MAJOR.MINOR.0 → publish PyPI / npm / crates.io and cut a
#                GitHub Release with the C++/MEX artifacts. Each prod publish is
#                gated by its environment (pypi/npm/crates/native = required
#                reviewer); TestPyPI is ungated.
#
# Version is computed from PyPI history (.github/scripts/calculate_version.py)
# and stamped across all languages (scripts/set-version.sh) — no manual bumps,
# no release tags.
#
# Auth: PyPI/TestPyPI via OIDC trusted publishing (configure pending publishers
# on pypi.org + test.pypi.org for workflow `release.yml`, envs pypi/testpypi);
# crates.io via CARGO_TOKEN; npm via NPM_TOKEN (bootstrap — switch to OIDC once
# the package exists).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===== Derive the single lockstep version =====
  version:
    name: Derive version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish_test: ${{ steps.v.outputs.should_publish_test }}
      publish_prod: ${{ steps.v.outputs.should_publish_prod }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: python3 .github/scripts/calculate_version.py
        env:
          PACKAGE_NAME: ferromode
          MAJOR_VERSION: "0"

  # ===== Python wheels (built once, published to Test/real PyPI) =====
  py-wheels:
    name: Wheel · ${{ matrix.id }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, id: linux-x86_64, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, id: linux-aarch64, target: aarch64, manylinux: auto }
          # Intel mac wheel is cross-compiled on the arm64 runner (macos-13
          # Intel runners are being retired and queue/fail).
          - { os: macos-14, id: macos-x86_64, target: x86_64, manylinux: "off" }
          - { os: macos-14, id: macos-arm64, target: aarch64, manylinux: "off" }
          - { os: windows-latest, id: windows-x86_64, target: x64, manylinux: "off" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/set-version
        with:
          version: ${{ needs.version.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --manifest-path crates/ferromode-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.id }}
          path: dist/

  py-testpypi:
    name: Publish → TestPyPI
    needs: [version, py-wheels]
    if: needs.version.outputs.publish_test == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      # Registry-parity: install the just-published wheel *from TestPyPI* (not
      # the local build) and smoke-test that it imports and exposes the API.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify install from TestPyPI
        run: |
          VER="${{ needs.version.outputs.version }}"
          PEP440="${VER/-dev./.dev}"   # maturin normalizes -dev.N → .devN
          for i in $(seq 1 8); do
            pip install --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ "ferromode==$PEP440" && break
            echo "waiting for TestPyPI index ($i)…"; sleep 15
          done
          python -c "import ferromode; \
            names=[n for n in dir(ferromode) if not n.startswith('_')]; \
            assert names, 'ferromode imported empty'; \
            print('ferromode from TestPyPI OK:', names[:10])"

  py-pypi:
    name: Publish → PyPI (gated)
    needs: [version, py-wheels]
    if: needs.version.outputs.publish_prod == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify install from PyPI
        run: |
          VER="${{ needs.version.outputs.version }}"
          PEP440="${VER/-dev./.dev}"
          for i in $(seq 1 10); do
            pip install --upgrade "ferromode==$PEP440" && break
            echo "waiting for PyPI index ($i)…"; sleep 15
          done
          python -c "import ferromode; \
            assert [n for n in dir(ferromode) if not n.startswith('_')]; \
            print('ferromode from PyPI OK')"

  # ===== crates.io =====
  crates-check:
    name: crates.io dry-run
    needs: version
    if: needs.version.outputs.publish_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/set-version
        with:
          version: ${{ needs.version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo publish --dry-run --allow-dirty -p ferromode

  crates-publish:
    name: Publish → crates.io (gated)
    needs: version
    if: needs.version.outputs.publish_prod == 'true'
    runs-on: ubuntu-latest
    environment: crates
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/set-version
        with:
          version: ${{ needs.version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo publish --allow-dirty -p ferromode
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

  # ===== npm (no sandbox: PR previews go to GitHub Packages, real npm on merge) =====
  npm-preview:
    name: npm preview → GitHub Packages
    needs: version
    if: needs.version.outputs.publish_test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/set-version
        with:
          version: ${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@snoodleboot-io"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build + publish preview to GitHub Packages
        working-directory: crates/ferromode-wasm
        run: |
          wasm-pack build --target bundler --release
          cd pkg
          npm pkg set name="@snoodleboot-io/ferromode"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Registry-parity: install the published preview *from GitHub Packages* and
      # verify the artifact (a wasm `bundler` package isn't require-able in bare
      # Node, so we assert install + package metadata rather than a runtime call).
      - name: Verify install from GitHub Packages
        run: |
          VER="${{ needs.version.outputs.version }}"
          work=$(mktemp -d); cd "$work"
          printf '@snoodleboot-io:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.GITHUB_TOKEN }}" > .npmrc
          npm init -y >/dev/null
          npm install "@snoodleboot-io/ferromode@$VER"
          node -e "const p=require('@snoodleboot-io/ferromode/package.json'); \
            if(p.version!==process.env.VER){console.error('version mismatch',p.version,process.env.VER);process.exit(1);} \
            console.log('npm preview from GitHub Packages OK:',p.name,p.version)"
        env:
          VER: ${{ needs.version.outputs.version }}

  npm-publish:
    name: Publish → npm (gated)
    needs: version
    if: needs.version.outputs.publish_prod == 'true'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/set-version
        with:
          version: ${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build + publish
        working-directory: crates/ferromode-wasm
        run: |
          wasm-pack build --target bundler --release
          cd pkg
          npm pkg set name="@snoodleboot-io/ferromode"
          npm pkg set publishConfig.access="public"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify install from npm
        run: |
          VER="${{ needs.version.outputs.version }}"
          work=$(mktemp -d); cd "$work"
          npm init -y >/dev/null
          for i in $(seq 1 8); do
            npm install "@snoodleboot-io/ferromode@$VER" && break
            echo "waiting for npm index ($i)…"; sleep 15
          done
          node -e "const p=require('@snoodleboot-io/ferromode/package.json'); \
            if(p.version!=='$VER'){process.exit(1);} \
            console.log('npm from registry OK:',p.name,p.version)"

  # ===== C++ / MEX native artifacts → GitHub Release (merge only) =====
  native:
    name: Native ${{ matrix.target_id }}
    needs: version
    if: needs.version.outputs.publish_prod == 'true'
    runs-on: ${{ matrix.os }}
    environment: native
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target_id: linux-x86_64, cxx_lib: libferromode_cxx.so, mex_lib: libferromode_mex.so, mex_ext: mexa64 }
          - { os: macos-14, target_id: macos-arm64, cxx_lib: libferromode_cxx.dylib, mex_lib: libferromode_mex.dylib, mex_ext: mexmaca64 }
          - { os: windows-latest, target_id: windows-x86_64, cxx_lib: ferromode_cxx.dll, mex_lib: ferromode_mex.dll, mex_ext: mexw64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/set-version
        with:
          version: ${{ needs.version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      # C++ builds on every platform (clean cdylib).
      - name: Build + package C++
        run: |
          cargo build --release -p ferromode-cxx
          V="${{ needs.version.outputs.version }}"
          cxx="ferromode-cxx-${V}-${{ matrix.target_id }}"
          mkdir -p "$cxx/include" "$cxx/lib"
          cp crates/ferromode-cxx/include/ferromode.hpp "$cxx/include/"
          cp "target/release/${{ matrix.cxx_lib }}" "$cxx/lib/"
          tar -czf "${cxx}.tar.gz" "$cxx"
      # MEX references MATLAB symbols that are only resolved at load time; only
      # the Linux cdylib linker tolerates that without MATLAB present, so MEX is
      # built on Linux (MATLAB + Octave). mac/Windows MEX needs MATLAB in CI
      # (matlab-actions) — a follow-up.
      - name: Build + package MEX (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          V="${{ needs.version.outputs.version }}"
          cargo build --release -p ferromode-mex
          mex="ferromode-mex-${V}-linux-x86_64"
          mkdir -p "$mex"
          cp crates/ferromode-mex/m/*.m "$mex/"
          cp target/release/libferromode_mex.so "$mex/ferromode_mex.mexa64"
          tar -czf "${mex}.tar.gz" "$mex"
          FERROMODE_OCTAVE=1 cargo build --release -p ferromode-mex
          oct="ferromode-mex-octave-${V}-linux-x86_64"
          mkdir -p "$oct"
          cp crates/ferromode-mex/m/*.m "$oct/"
          cp target/release/libferromode_mex.so "$oct/ferromode_mex.mex"
          tar -czf "${oct}.tar.gz" "$oct"
      - name: Attach to GitHub Release v${{ needs.version.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            ferromode-cxx-*.tar.gz
            ferromode-mex-*.tar.gz
