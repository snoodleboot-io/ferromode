name: Publish to crates.io (Rust)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify Release Quality
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. Cache dependencies
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cargo
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      # 4. Format check
      - name: Check code formatting
        run: cargo fmt -- --check

      # 5. Lint check (Clippy)
      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      # 6. Build all targets
      - name: Build library
        run: cargo build --release -p ferromode

      # 7. Run all tests
      - name: Run all tests
        run: cargo test --lib -p ferromode

      # 8. Build documentation
      - name: Build documentation
        run: cargo doc --no-deps -p ferromode

      # 9. Check MSRV (Minimum Supported Rust Version)
      - name: Check MSRV (1.75)
        run: cargo build -p ferromode

      # 10. Verify no breaking changes
      - name: Check dependencies
        run: cargo tree -p ferromode

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: verify
    if: success()

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. Cache dependencies
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cargo
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      # 4. Verify package contents
      - name: Package contents check
        run: |
          echo "Files to publish:"
          cargo package --list -p ferromode | head -20

      # 5. Verify version consistency
      - name: Verify version consistency
        run: |
          echo "Main crate version:"
          grep "^version" crates/ferromode/Cargo.toml | head -1

      # 6. Dry-run publish to check for issues
      - name: Dry-run publish
        run: cargo publish --dry-run -p ferromode

      # 7. Publish to crates.io
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: cargo publish -p ferromode

      # 8. Verify publication
      - name: Verify publication
        run: |
          echo "Waiting for crates.io index to update..."
          sleep 30
          cargo search ferromode --limit 1

      # 9. Create release summary
      - name: Create release summary
        run: |
          VERSION=$(grep "^version" crates/ferromode/Cargo.toml | sed 's/version = "//' | sed 's/"//')
          {
            echo "## ✅ crates.io Package Published"
            echo ""
            echo "**Crate:** ferromode"
            echo "**Version:** $VERSION"
            echo "**Registry:** https://crates.io/crates/ferromode"
            echo "**Docs:** https://docs.rs/ferromode/$VERSION"
            echo "**Install:** \`cargo add ferromode@$VERSION\`"
            echo ""
            echo "### Quality Checks"
            echo "✅ Formatting verified"
            echo "✅ Clippy lints passed"
            echo "✅ All tests passed"
            echo "✅ Documentation builds"
            echo "✅ MSRV compatible (1.75+)"
            echo "✅ Dry-run successful"
          } >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify on completion
    runs-on: ubuntu-latest
    needs: [publish]
    if: always()

    steps:
      - name: Check status
        run: |
          if [ "${{ needs.publish.result }}" == "success" ]; then
            echo "✅ crates.io publishing completed successfully"
            exit 0
          else
            echo "❌ crates.io publishing failed"
            exit 1
          fi
